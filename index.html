<!DOCTYPE html>
<html>

<head>
    <title>Anchorage Hiking</title>

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- ArcGIS Maps SDK CSS -->
    <link rel="stylesheet"
          href="https://js.arcgis.com/5.1/esri/themes/light/main.css">

    <!-- ArcGIS Maps SDK -->
    <script type="module"
            src="https://js.arcgis.com/5.1/"></script>
</head>

<body>

    <!-- Page title -->
    <header>
        <h1>Anchorage Hiking</h1>
    </header>

    <!-- Main part of the app -->
    <main>

        <!-- LEFT: selected photograph -->
        <section id="photo-panel">

            <h2>Anchorage Photos</h2>

            <img id="selected-photo"
                 src="Photos with data\Blueberry Knoll.jpeg"
                 alt="Selected Anchorage location">

            <h3 id="photo-title">Blueberry Knoll</h3>

               <div id="add-location-section">
                <h3>Add Your Location</h3>
                <form id="location-form">
                    <label for="location-title">Location title</label>
                    <input type="text" id="location-title" placeholder="e.g. My Favorite Park" required>

                    <label for="location-image">Upload a photo</label>
                    <input type="file" id="location-image" accept="image/*" required>

                    <label for="location-longitude">Longitude (degrees)</label>
                    <input type="number" id="location-longitude" placeholder="e.g. -149.67" step="any" min="-180" max="180" required>

                    <label for="location-latitude">Latitude (degrees)</label>
                    <input type="number" id="location-latitude" placeholder="e.g. 61.10" step="any" min="-90" max="90" required>

                    <button type="submit" id="add-location-btn">Add Location to Map</button>
                </form>
                <p id="form-message" role="status" aria-live="polite"></p>
            </div>

        </section>

        <!-- Distance calculator for two existing locations -->
            <section id="distance-panel">
                <h3>Distance Between Two Locations</h3>
                <label for="point1">First location</label>
                <select id="point1"></select>

                <label for="point2">Second location</label>
                <select id="point2"></select>

                <button id="distance-btn">Calculate Distance</button>
                <p id="distance-result">Click the button to calculate.</p>
            </section>

        <!-- RIGHT: map -->
        <section id="map"></section>

    </main>


    <!-- Bottom photo gallery -->
    <section id="gallery-section">

    <div id="gallery-header">

        <h2>Additional locations</h2>

        <button id="gallery-toggle" title="Collapse gallery">
            <span id="toggle-arrow"></span>
        </button>

    </div>

    <div id="gallery"></div>

</section>


    <!-- Our JavaScript -->
    <script type="module" src="script.js"></script>

</body>

</html>
